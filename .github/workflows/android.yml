name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      # Uploads via the GitHub web UI (or ZIP extracts on Windows) drop the
      # executable bit, which makes ./gradlew fail with "Permission denied".
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify no INTERNET permission in merged manifest
        run: |
          MANIFEST=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::Merged manifest not found"; exit 1
          fi
          echo "Checking $MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::INTERNET permission found in merged manifest"; exit 1
          fi
          echo "OK – no INTERNET permission."
      - uses: actions/upload-artifact@v4
        with:
          name: nothingpacker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
